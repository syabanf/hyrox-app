# Full demo stack: http://localhost:8088 (member) + /admin (panel).
# Both apps run their entire backend in the visitor's browser (MSW).
services:
  member:
    build:
      context: .
      dockerfile: deploy/member.Dockerfile
  admin:
    build:
      context: .
      dockerfile: deploy/admin.Dockerfile
  proxy:
    image: nginx:alpine
    volumes:
      - ./deploy/nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '8088:80'
    depends_on:
      - member
      - admin
