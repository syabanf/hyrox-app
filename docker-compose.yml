# The whole product in one command:
#
#   docker compose up -d --build       # database, API, both apps, front door
#   docker compose --profile seed run --rm seed     # load the demo studio
#
#   http://localhost:8088         member PWA
#   http://localhost:8088/admin   admin panel
#   http://localhost:8088/api     Go API (also direct on :9080)
#
# One repository, one stack: the member app, the admin panel and the API that
# backs them, in front of the database they share.

name: nuhabit

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nuhabit
      POSTGRES_PASSWORD: nuhabit
      POSTGRES_DB: nuhabit
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # The API waits for this rather than sleeping and hoping.
      test: ['CMD-SHELL', 'pg_isready -U nuhabit -d nuhabit']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./apps/backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: development
      HTTP_ADDR: ':8080'
      DATABASE_URL: postgres://nuhabit:nuhabit@postgres:5432/nuhabit?sslmode=disable
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-change-me}
      AUTH_DEMO_OTP: 'true'
      LOG_FORMAT: text
      STUDIO_TIMEZONE: Asia/Jakarta
      HTTP_ALLOWED_ORIGINS: '*'
    ports:
      - '9080:8080'
    healthcheck:
      # The image is scratch — no shell, no wget — so the check is the binary
      # asking itself. `api -health` exits non-zero when the API is not ready.
      test: ['CMD', '/usr/local/bin/api', '-health']
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 6
    restart: unless-stopped

  # One-shot: load the demo studio, then exit.
  seed:
    build:
      context: ./apps/backend
    profiles: ['seed']
    depends_on:
      # The API owns the migrations; seeding a schema that has not been
      # migrated yet fails on a table that does not exist.
      api:
        condition: service_healthy
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://nuhabit:nuhabit@postgres:5432/nuhabit?sslmode=disable
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-change-me}
      LOG_FORMAT: text
    entrypoint: ['/usr/local/bin/seed']

  member:
    build:
      context: .
      dockerfile: deploy/member.Dockerfile
      args:
        # /api on the front door's own origin. VITE_OFFLINE_DEMO=1 builds the
        # app against its bundled seed instead, with no server behind it.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL-/api}
        VITE_OFFLINE_DEMO: ${VITE_OFFLINE_DEMO-}
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: deploy/admin.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL-/api}
        NEXT_PUBLIC_OFFLINE_DEMO: ${NEXT_PUBLIC_OFFLINE_DEMO-}
    restart: unless-stopped

  # The front door: one origin for the apps and the API, so the browser makes
  # same-origin calls and CORS never enters the picture.
  proxy:
    image: nginx:alpine
    volumes:
      - ./deploy/nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '8088:80'
    depends_on:
      member:
        condition: service_healthy
      admin:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  # ── Split deployment ───────────────────────────────────────────────────────
  # The same API image mounting different modules. Proof that the module
  # boundaries are real: each service 404s on the other's routes, and a token
  # minted by one is accepted by the other with no shared session store.

  api-studio:
    build:
      context: ./apps/backend
    profiles: ['split']
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: development
      HTTP_ADDR: ':8080'
      DATABASE_URL: postgres://nuhabit:nuhabit@postgres:5432/nuhabit?sslmode=disable
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-change-me}
      AUTH_DEMO_OTP: 'true'
      LOG_FORMAT: text
      MODULES: catalog,identity,scheduling,access,reporting
    ports:
      - '9081:8080'

  api-commerce:
    build:
      context: ./apps/backend
    profiles: ['split']
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: development
      HTTP_ADDR: ':8080'
      DATABASE_URL: postgres://nuhabit:nuhabit@postgres:5432/nuhabit?sslmode=disable
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-change-me}
      LOG_FORMAT: text
      # Migrations belong to one owner; a second replica applying them
      # concurrently is safe but pointless.
      AUTO_MIGRATE: 'false'
      MODULES: wallet,incentives
    ports:
      - '9082:8080'

volumes:
  postgres-data:
