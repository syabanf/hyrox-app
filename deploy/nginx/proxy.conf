# Front door: member app at /, admin under /admin (prefix NOT stripped),
# and the Go API under /api. One origin means the browser never makes a
# cross-origin call, so CORS never enters the picture.
server {
  listen 80;

  location /api {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /admin {
    proxy_pass http://admin:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://member:80;
    proxy_set_header Host $host;
  }
}
