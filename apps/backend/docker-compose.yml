# Local stack: PostgreSQL plus the API.
#
#   docker compose up --build          the modular monolith on :9080
#   docker compose --profile split up  the same code split into two services
#
# The split profile is not a different build. It runs the same image twice with
# different MODULES settings, which is the point: extraction is configuration
# first, and only becomes a code change when a module needs its own database.

name: nuhabit

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nuhabit
      POSTGRES_PASSWORD: nuhabit
      POSTGRES_DB: nuhabit
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # The API waits for this rather than sleeping and hoping.
      test: ["CMD-SHELL", "pg_isready -U nuhabit -d nuhabit"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: development
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://nuhabit:nuhabit@postgres:5432/nuhabit?sslmode=disable
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-change-me}
      AUTH_DEMO_OTP: "true"
      LOG_FORMAT: text
      STUDIO_TIMEZONE: Asia/Jakarta
      # The member PWA and admin panel call this API from their own origins.
      HTTP_ALLOWED_ORIGINS: "*"
    ports:
      - "9080:8080"
    restart: unless-stopped

  # One-shot: load the demo studio, then exit.
  seed:
    build:
      context: .
    profiles: ["seed"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://nuhabit:nuhabit@postgres:5432/nuhabit?sslmode=disable
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-change-me}
      LOG_FORMAT: text
    entrypoint: ["/usr/local/bin/seed"]

  # ── Split deployment ───────────────────────────────────────────────────────
  # The same image, mounting different modules. Put a gateway in front and each
  # of these can scale, deploy and fail independently.

  api-studio:
    build:
      context: .
    profiles: ["split"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: development
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://nuhabit:nuhabit@postgres:5432/nuhabit?sslmode=disable
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-change-me}
      AUTH_DEMO_OTP: "true"
      LOG_FORMAT: text
      MODULES: catalog,identity,scheduling,access,reporting
    ports:
      - "9081:8080"

  api-commerce:
    build:
      context: .
    profiles: ["split"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: development
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://nuhabit:nuhabit@postgres:5432/nuhabit?sslmode=disable
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-change-me}
      LOG_FORMAT: text
      # Migrations are owned by the studio service; a second replica applying
      # them concurrently is safe but pointless.
      AUTO_MIGRATE: "false"
      MODULES: wallet,incentives
    ports:
      - "9082:8080"

volumes:
  postgres-data:
